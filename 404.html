  <script>try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>

    .nf { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 32px 16px; }

    .nf h1 { font-size: clamp(30px, 6vw, 44px); margin-bottom: 12px; }
    .nf p { color: var(--ink-soft); margin: 0 auto 28px; max-width: 42ch; }
    .nf .t { fill: var(--blue); } .nf .g { fill: var(--green); } .nf .y { fill: var(--yellow); }
    .nf .e { stroke: var(--edge); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 6 8; }
  </style>
</head>
<body>
  <main class="nf">
    <div>
      <svg viewBox="0 0 220 150" aria-hidden="true">
        <line class="e" x1="110" y1="40" x2="45" y2="110"/>
        <line class="e" x1="110" y1="40" x2="175" y2="110"/>
        <line class="e" x1="45" y1="110" x2="175" y2="110"/>
        <circle class="t" cx="110" cy="38" r="26"/>
        <circle class="g" cx="45" cy="112" r="22"/>
        <circle class="y" cx="175" cy="112" r="22" opacity=".35"/>
